[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-shield"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
# Direct third-party imports of src/*.py and tests/*.py that run in .venv
# (finetune.py, translate_indic.py, protect.py belong to the other venvs).
dependencies = [
    "anthropic==1.11.0",
    "datasketch==2.0.0",
    "fastapi==0.143.0",
    "gradio==6.29.1",
    "httpx==0.28.1",   # shield/core/net.py, the live link checks (D23); also fastapi.testclient
    "huggingface_hub==1.33.0",   # < 2 because tokenizers 0.23.2 requires it; the same as .venv-finetune
    "safetensors==0.8.0",
    "tokenizers==0.23.2",
    "torch==2.14.1",   # the MuRIL text head (shield.messages.text_head.MurilScorer); the versions the Mac val re-score used
    "transformers==5.19.0",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pillow==12.3.0",
    "pydantic==2.13.5",
    "python-multipart==0.0.32",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "tldextract==5.4.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = []   # httpx moved to the main dependencies (D23); pytest is in requirements-dev.txt

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["textprep", "url_features", "pii"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["shield*"]
