<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scam Shield Light Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lexend:wght@400..600&family=Geist+Mono:wght@400..500&display=swap">
<style>
/* Light-mode landing reference for Scam Shield. The globe uses the SAME size and placement as the dark-mode three.js globe
   (components/Globe.tsx: PerspectiveCamera fov 42, radius 100, camera z 300 / lift 62 on wide screens, z 440 / lift 95 under 640px),
   and draws it with the same perspective camera, so the globe's size, position and the way India looms larger near the front all match. Style: "F4 + G3" from the design page:
   cool grey sphere darkening to its edge, red glow, evenly spaced land dots (no ocean dots), India drawn only in red from the app's official outline data. */
:root {
  color-scheme: light;
  --bg: #F2F3F5; --ink: #16181D; --ink-2: #4A505C; --muted: #6B7280; --line: #DADDE2; --card: #FFFFFF; --red: #C8222A;
  --sphere-0: #F1F3F6; --sphere-1: #E4E7EC; --sphere-2: #CDD2DA; --sphere-3: #B8BEC8;
  --shade: 120,128,142; --dot-land: #111317; --dot-india: #C1121F; --aura: 200,34,42;
  --display: "Libre Baskerville", Georgia, serif; --sans: "Lexend", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
html { background-color: var(--bg);
  background-image: radial-gradient(rgba(22,24,29,.07) 1px, transparent 1.2px); background-size: 22px 22px; background-attachment: fixed; }
body { color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; overflow-x: hidden; }
.stage { position: fixed; inset: 0; z-index: 0; }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: pan-y; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.calm { position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 40% 20% at 50% 42%, rgba(242,243,245,.55) 30%, transparent 100%); }
header { position: relative; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px; }
.mark { display: flex; align-items: center; gap: 10px; font: 700 17px var(--display); letter-spacing: -.01em; }
.mark svg { width: 22px; height: 22px; }
.right { display: flex; align-items: center; gap: 8px; }
.local { font: 500 11.5px var(--mono); color: var(--ink-2); display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 10px; background: var(--card); }
.mark, .local { white-space: nowrap; }
@media (max-width: 420px) { .local { font-size: 10.5px; padding: 5px 8px; } .mark { font-size: 16px; } header { padding-inline: 14px; } }
.local i { width: 6px; height: 6px; border-radius: 50%; background: #1E8E5A; }
.tog { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
main { position: relative; z-index: 2; display: grid; justify-items: center; align-content: center; min-height: calc(100vh - 76px); padding: 80px 16px 40px; box-sizing: border-box; pointer-events: none; }
main > * { pointer-events: auto; }
.hero { width: min(100%, 640px); display: grid; gap: 14px; justify-items: center; text-align: center; }
h1 { max-width: 12ch; margin: 0; font: 700 clamp(32px, 5.4vw, 54px)/1.06 var(--display); letter-spacing: -.01em; text-wrap: balance; }
h1, .sub { text-shadow: 0 1px 18px var(--bg), 0 0 2px var(--bg); }
h1 em { font-style: normal; color: var(--red); }
.sub { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 44ch; }
.box { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 14px 12px; display: grid; gap: 18px;
  text-align: left; box-shadow: 0 16px 34px -24px rgba(20,22,28,.45); }
.box textarea { border: 0; outline: 0; resize: none; font: 400 16px var(--sans); color: var(--ink); background: transparent; min-height: 52px; }
.box textarea::placeholder { color: var(--muted); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.row small { font: 400 11.5px var(--mono); color: var(--muted); }
.btns { display: flex; gap: 8px; }
button { font: 600 14px var(--sans); border-radius: 12px; padding: 9px 15px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.go { background: var(--ink); color: #fff; border-color: var(--ink); }
.go:disabled { background: #3A3F48; border-color: #3A3F48; color: #E6E8EC; cursor: not-allowed; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
.chips span { font: 400 12px var(--mono); color: var(--muted); }
.chips button { border-radius: 999px; font-weight: 400; padding: 6px 13px; }

</style>
</head>
<body>
<div class="stage" aria-hidden="true"><canvas id="globe"></canvas></div>
<div class="calm" aria-hidden="true"></div>
<header>
  <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4" stroke="#C8222A"/></svg>Scam Shield</span>
  <span class="right"><span class="local"><i></i>Checked on this device</span>
  <span class="tog" title="Theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span>
</header>
<main>
  <div class="hero">
    <h1>Got a message that feels <em>off</em>?</h1>
    <p class="sub">Paste it here. We read it for the tricks scammers use and tell you why, in a few seconds.</p>
    <div class="box">
      <textarea id="msg" rows="2" placeholder="Paste a WhatsApp, SMS or email message…" aria-label="Message to check"></textarea>
      <div class="row"><small>links, UPI IDs and numbers show up here</small><span class="btns"><button>Screenshot</button><button class="go" id="go" disabled>Check</button></span></div>
    </div>
    <div class="chips"><span>try</span><button>Digital arrest call</button><button>KYC update SMS</button><button>Genuine bank alert</button></div>
  </div>
</main>

        if ((r[i][0] > la) !== (r[j][0] > la) && lo < (r[j][1] - r[i][1]) * (la - r[i][0]) / (r[j][0] - r[i][0]) + r[i][1]) hit = !hit;
      }
    });
    return hit;
  }
  // Land mask on a 1-degree grid from the app's land.json, widened by one cell.
  var LS = {};
  for (var i = 0; i < LAND.length; i += 2) {
    var la = Math.round(LAND[i]), lo = Math.round(LAND[i + 1]), rl = Math.min(6, Math.ceil(1 / Math.max(.2, Math.cos(LAND[i] * D2R))));
    for (var a = -1; a <= 1; a++) for (var b = -rl; b <= rl; b++) LS[(la + a) * 1000 + ((lo + b + 540) % 360)] = 1;
  }
  // Evenly spaced dots (golden-angle spiral, like Stripe's globe); about 15,000 over the whole sphere.
  var SEA = [], LND = [], IND = [], N = 15000, ga = Math.PI * (3 - Math.sqrt(5));
  for (var k = 0; k < N; k++) {
    var z = 1 - 2 * (k + .5) / N, lat = Math.asin(z), lon = ((k * ga) % (2 * Math.PI)) - Math.PI, dla = lat / D2R, dlo = lon / D2R;
    if (inIndia(dla, dlo)) continue;
    if (LS[Math.round(dla) * 1000 + ((Math.round(dlo) + 540) % 360)]) LND.push([lat, lon]);
  }
  // India: every dot from india.json (about 0.4 degrees apart, roughly 4x denser than the land dots), red only.
  for (var m = 0; m < INDIA.dots.length; m += 2) IND.push([INDIA.dots[m] * D2R, INDIA.dots[m + 1] * D2R]);

  var W = 0, H = 0, dpr = 1, cam = null;
  // Exactly the dark globe's camera (Globe.tsx): perspective, 42-degree vertical field of view, globe radius 100 at the origin,
  // camera at (0, lift, z) looking straight ahead at (0, lift, 0). Wide screens z 300 / lift 62; under 640px z 440 / lift 95.
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var narrow = W < 640, z = narrow ? 440 : 300, lift = narrow ? 95 : 62, f = (H / 2) / Math.tan(21 * D2R), d = Math.sqrt(z * z + lift * lift);
    cam = { z: z, lift: lift, f: f, cx: W / 2, cy: H / 2 + f * lift / z, r: f * 100 / Math.sqrt(d * d - 1e4) };   // silhouette centre and radius
  }
  // Same orientation as the dark globe: three's vec() mapping, India (20N, 79E) turned to face the camera and tipped 14 degrees so it sits just below the input, as on the dark landing.
  function vec(lat, lon) {
    var ph = (90 - lat / D2R) * D2R, th = (lon / D2R + 180) * D2R;
    return [-100 * Math.sin(ph) * Math.cos(th), 100 * Math.cos(ph), 100 * Math.sin(ph) * Math.sin(th)];
  }
  function pre(list) { return list.map(function (p) { return vec(p[0], p[1]); }); }
  var iv = vec(20 * D2R, 79 * D2R), rotY = -Math.atan2(iv[0], iv[2]), rotX = 14 * D2R, vel = 0, dragging = false;
  var P_LND = pre(LND), P_IND = pre(IND);
  function dots(list, color, k) {
    ctx.fillStyle = color;
    var cy = Math.cos(rotY), sy = Math.sin(rotY), cx = Math.cos(rotX), sx = Math.sin(rotX);
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var x1 = cy * p[0] + sy * p[2], z1 = -sy * p[0] + cy * p[2], y1 = p[1];      // rotation.y
      var y2 = cx * y1 - sx * z1, z2 = sx * y1 + cx * z1;                           // rotation.x (Euler XYZ: Rx after Ry)
      var vx = -x1, vy = cam.lift - y2, vz = cam.z - z2, dot = (x1 * vx + y2 * vy + z2 * vz);
      if (dot <= 0) continue;                                                        // on the far side
      var depth = vz, sxp = cam.cx + cam.f * x1 / depth, syp = H / 2 - cam.f * (y2 - cam.lift) / depth;
      if (syp > H + 4 || sxp < -4 || sxp > W + 4) continue;
      var facing = dot / (100 * Math.sqrt(vx * vx + vy * vy + vz * vz));
      ctx.globalAlpha = .45 + .55 * Math.min(1, facing * 1.6);
      ctx.beginPath(); ctx.arc(sxp, syp, k * (H / 2) / depth, 0, 6.283); ctx.fill();   // sized like three's attenuated points
    }
    ctx.globalAlpha = 1;
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    var c = cam, A = tok('--aura'), au = ctx.createRadialGradient(c.cx, c.cy, c.r * .96, c.cx, c.cy, c.r * 1.28);
    au.addColorStop(0, 'rgba(' + A + ',.34)'); au.addColorStop(.35, 'rgba(' + A + ',.14)'); au.addColorStop(1, 'rgba(' + A + ',0)');
    ctx.fillStyle = au; ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r * 1.28, 0, 6.283); ctx.fill();
    var sp = ctx.createRadialGradient(c.cx, c.cy, c.r * .05, c.cx, c.cy, c.r);
    sp.addColorStop(0, tok('--sphere-0')); sp.addColorStop(.7, tok('--sphere-1')); sp.addColorStop(.93, tok('--sphere-2')); sp.addColorStop(1, tok('--sphere-3'));
    ctx.fillStyle = sp; ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, 6.283); ctx.fill();
    // extra shade on the top edge: a ring centred below the globe's middle, so it is thickest along the top rim
    var top = ctx.createRadialGradient(c.cx, c.cy + c.r * .22, c.r * .55, c.cx, c.cy + c.r * .22, c.r * 1.22);
    top.addColorStop(0, 'rgba(' + tok('--shade') + ',0)'); top.addColorStop(.62, 'rgba(' + tok('--shade') + ',0)'); top.addColorStop(1, 'rgba(' + tok('--shade') + ',.42)');
    ctx.save(); ctx.beginPath(); ctx.arc(c.cx, c.cy, c.r, 0, 6.283); ctx.clip(); ctx.fillStyle = top; ctx.fillRect(c.cx - c.r, c.cy - c.r, c.r * 2, c.r * 2); ctx.restore();
    dots(P_LND, tok('--dot-land'), .85);
    dots(P_IND, tok('--dot-india'), .6);
  }
  // Spin like the dark globe: 0.035 rad/s eastward, drag to turn, with a little momentum.
  var last = performance.now(), raf = 0;
  function frame(now) {
    var dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!dragging) { rotY += dt * .035 + vel; vel *= .94; }
    draw(); raf = requestAnimationFrame(frame);
  }
  var px = 0, py = 0;
  cv.addEventListener('pointerdown', function (e) { dragging = true; px = e.clientX; py = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py; px = e.clientX; py = e.clientY;
    rotY += dx * .005; vel = dx * .0004; rotX = Math.max(-.9, Math.min(.9, rotX + dy * .004));
    if (reduce) draw();
  });
  ['pointerup', 'pointercancel'].forEach(function (t) { cv.addEventListener(t, function () { dragging = false; }); });
  addEventListener('resize', function () { size(); draw(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!reduce && !raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  });
  size(); draw();
  if (!reduce) raf = requestAnimationFrame(frame);
})();
</script>
</body>
